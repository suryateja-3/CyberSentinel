<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO Meta Tags -->
    <title>CyberSentinel — AI-Powered Cybersecurity Platform</title>
    <meta name="description" content="CyberSentinel is an AI-powered cybersecurity platform for fake news detection, online fraud detection, and URL phishing analysis." />
    <meta name="keywords" content="cybersecurity, fake news detection, fraud detection, URL phishing, AI, machine learning, NLP" />
    <meta name="author" content="CyberSentinel Team" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CyberSentinel — AI Cybersecurity Platform" />
    <meta property="og:description" content="Detect fake news, online fraud, and phishing URLs with AI-powered analysis." />
    <meta property="og:site_name" content="CyberSentinel" />

    <!-- Theme & PWA -->
    <meta name="theme-color" content="#0b0f19" />
    <meta name="color-scheme" content="dark" />

    <!-- Favicon inline SVG -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>" />

    <!-- Preconnect to Google Fonts CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <!-- Skip to main content for accessibility -->
    <a href="#main-content" class="sr-only" style="
      position:absolute;
      left:-10000px;
      top:auto;
      width:1px;
      height:1px;
      overflow:hidden;
    ">Skip to main content</a>

    <!-- App Mount Point -->
    <div id="app" role="application" aria-label="CyberSentinel Application"></div>

    <!-- Toast Notification Container (injected by JS if not present) -->
    <div id="toast-container" role="region" aria-label="Notifications" aria-live="polite"></div>

    <!-- Main JS Entry -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
